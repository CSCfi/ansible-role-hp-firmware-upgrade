---

 - hosts: testservers
   remote_user: root

   pre_tasks:
    - name: Set some facts needed for testing
      ansible.builtin.set_fact:
        ansible_system_vendor: "{{ system_vendor }}"
        ansible_product_name: "HPSERVER GEN {{ gen }}"

    - name: Clean and rebuild cache
      command: "{{ item }}"
      loop:
      - dnf clean all
      - dnf makecache
      changed_when: false

   roles:
     - ansible-role-hp-firmware-upgrade
